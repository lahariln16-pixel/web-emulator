<!DOCTYPE html>
<html>
<head>
    <title>Web Emulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="toolbar">
        <button id="back">←</button>
        <button id="forward">→</button>
        <button id="reload">⟳</button>

        <input
            id="url"
            type="text"
            placeholder="Enter URL..."
        >

        <button id="go">GO</button>
    </div>

    <div id="screen">
        Enter a URL above.
    </div>

    <script src="app.js"></script>

</body>
</html>
