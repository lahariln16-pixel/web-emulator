<!DOCTYPE html>
<html>
<head>
    <title>Web Emulator Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 320px;
            padding: 30px;

            background: #222;
            border-radius: 12px;
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin: 15px 0;

            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        #error {
            margin-top: 12px;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🔐 Web Emulator</h2>

    <input
        id="password"
        type="password"
        placeholder="Enter password"
    >

    <button id="login">
        Login
    </button>

    <div id="error"></div>

</div>

<script>

const password = document.getElementById("password");
const login = document.getElementById("login");
const error = document.getElementById("error");

async function doLogin() {

    error.textContent = "";

    const response = await fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            password: password.value
        })

    });

    const data = await response.json();

    if (data.success) {

        window.location.href = "/";

    } else {

        error.textContent = data.error;

    }

}

login.addEventListener("click", doLogin);

password.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
        doLogin();
    }

});

</script>

</body>
</html>
